name: Publish to TestPyPI

# Manually triggered from the Actions tab whenever you want to test a build
# end-to-end before a real release — unlike publish.yml (real PyPI,
# triggered by a version tag), this never runs automatically: TestPyPI also
# refuses to re-upload an existing version, and most commits don't bump
# pyproject.toml's version, so an automatic trigger would fail more often
# than not. Authenticates via TestPyPI's Trusted Publishing (OIDC) — see
# CONTRIBUTING.md for the required one-time setup (note: this is a
# *separate* registration from the one used by publish.yml/real PyPI, with
# its own workflow filename and environment name).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/text2cypher-composer
    permissions:
      id-token: write # required for Trusted Publishing — do not add a token secret instead
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
